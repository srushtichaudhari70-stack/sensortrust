<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SensorTrust · AI Model & Voice-Enabled Sensor Intelligence</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <!-- Stlite CSS for in-browser Streamlit execution -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #0e1117;
      }
    </style>
  </head>
  <body>
    <!-- Stlite App Entrypoint -->
    <streamlit-app src="./app.py">
      <app-file name="core.py" url="./core.py"></app-file>
      <app-file name="ai_agent.py" url="./ai_agent.py"></app-file>
      <app-file name="voice_system.py" url="./voice_system.py"></app-file>
      <app-file name="evaluate.py" url="./evaluate.py"></app-file>
      <app-requirements>
numpy
pandas
plotly
lightgbm
scikit-learn
      </app-requirements>
    </streamlit-app>

    <!-- Stlite JS Engine -->
    <script type="module" src="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js"></script>
  </body>
</html>
